version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: erp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: college_erp
    volumes:
      - mongo_data:/data/db
    networks:
      - erp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017/college_erp
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Compose}
      CORS_ORIGIN: http://localhost:3000
      CLIENT_URL: http://localhost:3000
    volumes:
      - upload_data:/usr/src/app/uploads
      - log_data:/usr/src/app/logs
    depends_on:
      - mongodb
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - erp-network

volumes:
  mongo_data:
  upload_data:
  log_data:

networks:
  erp-network:
    driver: bridge
