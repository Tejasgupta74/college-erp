version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: erp-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: college_erp
    volumes:
      - mongo_data:/data/db
    networks:
      - erp-network

  redis:
    image: redis:7.2-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - erp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/college_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production_super_secure_college_erp_jwt_key_2026
      CLIENT_URL: http://localhost
    volumes:
      - upload_data:/usr/src/app/uploads
      - log_data:/usr/src/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - erp-network

volumes:
  mongo_data:
  redis_data:
  upload_data:
  log_data:

networks:
  erp-network:
    driver: bridge
