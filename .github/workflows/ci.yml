name: College ERP CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Seed Test Database
        working-directory: backend
        env:
          PORT: 8000
          MONGODB_URI: mongodb://127.0.0.1:27017/college_erp_test
          JWT_SECRET: testing_jwt_super_secret_key_minimum_32_characters_2026
          NODE_ENV: test
        run: npm run seed

      - name: Run Backend Integration & Production Tests
        working-directory: backend
        env:
          PORT: 8000
          MONGODB_URI: mongodb://127.0.0.1:27017/college_erp_test
          JWT_SECRET: testing_jwt_super_secret_key_minimum_32_characters_2026
          NODE_ENV: test
        run: npm test

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint & Verify Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
